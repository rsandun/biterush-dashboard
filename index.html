`<div class="sl">${['all','2022','2023','2024','2025'].map(y=>`<button class="${Y==y?'on':''}" onclick="Y='${y}';p0()">${y=='all'?'All years':y}</button>`).join('')}</div>
<div class="k">${kp('Orders',sum(R,x=>x.n))}${kp('Food sold (M LKR)',sum(R,x=>x.g),1)}${kp('Earnings per order (LKR)',wa(R,x=>x.e))}${kp('Late deliveries',wa(R,x=>x.l),0,'','%')}${kp('Cancelled',sum(R,x=>x.n*x.c)/sum(R,x=>x.n),1,'','%')}${kp('Rating (out of 5)',wa(R,x=>x.r),2)}</div>
<div class="g">${card('a1','Orders each month vs target',280,'Bars = actual, line = target')}${card('a2','Earnings per order (LKR)',280,'Red dots = Free Delivery Summer (Jul–Sep 2024)')}</div>`;count();
mk('a1',{data:{labels:R.map(x=>x.ym),datasets:[{type:'bar',label:'Orders',data:R.map(x=>x.n),backgroundColor:gr(C.t),borderRadius:6},{type:'line',label:'Target',data:R.map(x=>x.tg),borderColor:C.g,borderWidth:2,pointRadius:0}]},options:{scales:{x:{ticks:{maxTicksLimit:8}}}}});
const fs=x=>x.ym>='2024-07'&&x.ym<='2024-09';
mk('a2',{type:'line',data:{labels:R.map(x=>x.ym),datasets:[{data:R.map(x=>x.e),borderColor:C.i,borderWidth:2,tension:.3,pointRadius:R.map(x=>fs(x)?5:2),pointBackgroundColor:R.map(x=>fs(x)?C.r:C.i)}]},options:Object.assign({scales:{x:{ticks:{maxTicksLimit:8}}}},lg)})}
function p1(){const C=cols(),per=(a,b)=>M.filter(x=>x.ym>=a&&x.ym<=b),P=[per('2024-04','2024-06'),per('2024-07','2024-09'),per('2024-10','2024-12')];
const T=[['Orders per month',a=>sum(a,x=>x.n)/a.length,0],['Earnings per order (LKR)',a=>wa(a,x=>x.e),0],['Total earnings per month (K LKR)',a=>sum(a,x=>x.et)/a.length,0],['Delivery time (minutes)',a=>wa(a,x=>x.t),1],['Late deliveries (%)',a=>wa(a,x=>x.l),0],['Rating (out of 5)',a=>wa(a,x=>x.r),2]];
const v=T.map(t=>P.map(p=>t[1](p))),pc=(i)=>Math.round((v[i][1]/v[i][0]-1)*100);
V.innerHTML=head('Marketing and Finance are both right: orders jumped, but we earned less and served worse',`Orders rose ${pc(0)}%, yet earnings per order fell ${-pc(1)}% and total monthly earnings fell ${-pc(2)}%. Late deliveries went from ${v[4][0].toFixed(0)}% to ${v[4][1].toFixed(0)}% and the rating dropped to ${v[5][1].toFixed(2)}. Before = Apr–Jun 2024, During = Jul–Sep, After = Oct–Dec.`)+`<div class="g">${T.map((t,i)=>card('c'+i,t[0],170,v[i].map(x=>x.toFixed(t[2])).join(' → '))).join('')}</div>
<div class="note"><b>Lasting effect:</b> after the campaign ended, orders settled at ${f0(v[0][2])} a month, still above the ${f0(v[0][0])} before it, and earnings per order went back to normal (${f0(v[1][2])} LKR).</div>`;
T.forEach((t,i)=>mk('c'+i,{type:'bar',data:{labels:['Before','During','After'],datasets:[{data:v[i],backgroundColor:[C.m,C.r,C.t],borderRadius:5}]},options:Object.assign({scales:{y:{beginAtZero:true}}},lg)}))}
function p2(){const C=cols(),o=['Dry','Light Rain','Heavy Rain'],w=o.map(k=>D.w.find(x=>x[0]==k)),dr=w[0],hv=w[2];
V.innerHTML=head('Heavy rain slows every delivery and drives people away, but it also makes more people order',`Compared with a dry day, a heavy-rain day brings ${Math.round((hv[1]/dr[1]-1)*100)}% more orders, but deliveries take ${(hv[2]-dr[2]).toFixed(0)} minutes longer, ${hv[3].toFixed(0)}% of them are late (${dr[3].toFixed(0)}% when dry), cancellations double to ${hv[4].toFixed(1)}%, and the rating falls from ${dr[5]} to ${hv[5]}.`)+
`<div class="g">${[['Orders per day','Orders per day'],['Delivery time (minutes)','Delivery time (min)'],['Late deliveries (%)','Late deliveries (%)'],['Cancelled orders (%)','Cancelled orders (%)'],['Rating (out of 5)','Rating (out of 5)']].map((t,i)=>card('w'+i,t[1],190)).join('')}</div>`;
[1,2,3,4,5].forEach(j=>mk('w'+(j-1),{type:'bar',data:{labels:o,datasets:[{data:w.map(x=>x[j]),backgroundColor:[C.t,C.g,C.r],borderRadius:5}]},options:Object.assign({scales:{y:{beginAtZero:true}}},lg)}))}
function p3(){const C=cols(),H=Array.from({length:24},(_,h)=>{const r=D.h.filter(x=>x[1]==h),n=sum(r,x=>x[2]);return{h,n,l:sum(r,x=>x[2]*(x[3]||0))/n}}),ap=h=>(h%12||12)+(h<12?' am':' pm');
const top=[...H].sort((a,b)=>b.n-a.n).slice(0,2).map(x=>ap(x.h)),late=[...H].filter(x=>x.n>400).sort((a,b)=>b.l-a.l).slice(0,3).map(x=>ap(x.h));
V.innerHTML=head(`We are busiest at ${top.join(' and ')}, and most often late around ${late.join(', ')}`,'Add more riders just before these hours. Switch the heatmap to see how orders and late deliveries change by day and hour.')+
`<div class="sl"><button class="${HM=='n'?'on':''}" onclick="HM='n';p3()">Orders</button><button class="${HM=='l'?'on':''}" onclick="HM='l';p3()">Late deliveries (%)</button></div><div class="card sc"><div class="hm" id="hm"></div></div><div style="height:14px"></div>${card('h1','Orders and late deliveries by hour of day',260,'Bars = orders, line = % late')}`;
const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],mx=Math.max(...D.h.map(x=>x[2]));let s='<i></i>'+Array.from({length:24},(_,h)=>`<i>${h%3?'':h}</i>`).join('');
days.forEach((d,i)=>{s+=`<i>${d}</i>`;for(let h=0;h<24;h++){const c=D.h.find(x=>x[0]==i&&x[1]==h),a=c?(HM=='n'?c[2]/mx:Math.min(1,(c[3]||0)/100)):0;s+=`<span title="${d} ${ap(h)}: ${c?c[2]:0} orders, ${c&&c[3]!=null?c[3]:0}% late" style="background:${HM=='n'?C.t:C.r};opacity:${(.08+.92*a).toFixed(2)}"></span>`}});document.getElementById('hm').innerHTML=s;
mk('h1',{data:{labels:H.map(x=>ap(x.h)),datasets:[{type:'bar',label:'Orders',data:H.map(x=>x.n),backgroundColor:gr(C.t),borderRadius:6,yAxisID:'y'},{type:'line',label:'% late',data:H.map(x=>x.l),borderColor:C.r,pointRadius:2,yAxisID:'y1'}]},options:{scales:{y1:{position:'right',grid:{display:false},min:0,max:100},x:{ticks:{maxTicksLimit:12}}}}})}
function p4(){const C=cols(),RS=['No rider available','Customer cancelled','Payment failed','Restaurant closed'],tot=RS.map((_,i)=>sum(M,x=>x.rs[i])),bad=[...M].sort((a,b)=>b.c-a.c)[0],jl=M.find(x=>x.ym=='2022-07');
V.innerHTML=head(`“No rider available” is the biggest reason, and ${bad.ym} got out of hand`,`${f0(tot[0])} of ${f0(sum(tot,x=>x))} cancellations (${Math.round(tot[0]/sum(tot,x=>x)*100)}%) happened because no rider could be found.`)+`<div class="g">${card('x1','Cancelled orders each month, by reason',300)}${card('x2','All cancellations by reason',300)}</div>
<div class="note"><b>The hidden story, July 2022:</b> ${jl.c}% of orders were cancelled (normal is about 6%). 104 of the 119 cancellations had no rider available. It was a very wet month with 6 heavy-rain days, ${jl.l}% of deliveries were late and the rating fell to ${jl.r}. Too few riders for the rain was the likely cause.</div>`;
const cl=[C.r,C.g,C.t,C.m];mk('x1',{type:'bar',data:{labels:M.map(x=>x.ym),datasets:RS.map((r,i)=>({label:r,data:M.map(x=>x.rs[i]),backgroundColor:cl[i]}))},options:{scales:{x:{stacked:true,ticks:{maxTicksLimit:8}},y:{stacked:true}},plugins:{legend:{position:'bottom',labels:{boxWidth:10}}}}});
mk('x2',{type:'doughnut',data:{labels:RS,datasets:[{data:tot,backgroundColor:cl,borderWidth:0}]},options:{cutout:'62%',plugins:{legend:{position:'bottom',labels:{boxWidth:10}}}}})}
function p5(){const C=cols(),r=D.r.map(a=>({n:a[0],c:a[1],z:a[2],o:a[3],e:a[4],p:a[4]*1000/a[3]})),grp=k=>Object.entries(r.reduce((m,x)=>(m[x[k]]=(m[x[k]]||0)+x.e,m),{})).sort((a,b)=>b[1]-a[1]),cu=grp('c'),zo=grp('z'),top=[...r].sort((a,b)=>b.e-a.e).slice(0,10),ys=[2022,2023,2024,2025].map(y=>{const a=M.filter(x=>x.y==y);return Math.round(sum(a,x=>x.n)/sum(a,x=>x.tg)*100)});
V.innerHTML=head(`${top[0].n} earns us the most, ${cu[0][0]} is the top cuisine, and we ${ys.every(v=>v>=100)?'beat':'did not always reach'} our order target`,`Orders vs target by year: ${ys.map((v,i)=>2022+i+' '+v+'%').join(', ')}. Bubble size = total earnings.`)+`<div class="g">${card('m1','Restaurants: orders vs earnings per order',320,'Each bubble is a restaurant, coloured by cuisine')}${card('m2','Top 10 restaurants by total earnings (K LKR)',320)}${card('m3','Earnings by cuisine (K LKR)',260)}${card('m4','Earnings by zone (K LKR)',260)}${card('m5','Orders as % of target',260)}</div>`;
const pal=[C.t,C.r,C.g,C.i,'#7C5CBF','#3F8FD2','#8BA83A','#C46A9B'];
mk('m1',{type:'bubble',data:{datasets:cu.map((c,i)=>({label:c[0],data:r.filter(x=>x.c==c[0]).map(x=>({x:x.o,y:Math.round(x.p),r:Math.max(4,Math.sqrt(x.e)/2.2),n:x.n})),backgroundColor:pal[i%8]+'AA'}))},options:{scales:{x:{title:{display:true,text:'Delivered orders'}},y:{title:{display:true,text:'Earnings per order (LKR)'}}},plugins:{legend:{position:'bottom',labels:{boxWidth:10}},tooltip:{callbacks:{label:c=>c.raw.n+': '+c.raw.x+' orders, '+c.raw.y+' LKR each'}}}}});
const hb=(id,a)=>mk(id,{type:'bar',data:{labels:a.map(x=>x[0]),datasets:[{data:a.map(x=>x[1]),backgroundColor:C.t,borderRadius:4}]},options:Object.assign({indexAxis:'y'},lg)});
hb('m2',top.map(x=>[x.n,x.e]));hb('m3',cu);hb('m4',zo);
mk('m5',{type:'bar',data:{labels:['2022','2023','2024','2025'],datasets:[{data:ys,backgroundColor:ys.map(v=>v>=100?C.t:C.r),borderRadius:5}]},options:Object.assign({scales:{y:{beginAtZero:true}}},lg)})}
function p6(){V.innerHTML=head('Three recommendations for 2026','Each one comes from the pages before it.')+`<div class="g"><div class="card"><h3>1. Never run free delivery for everyone again</h3><p>It brought extra orders but earnings per order fell by about two thirds and service got worse. Use smaller, targeted offers, such as free delivery only on orders above a minimum value.</p></div><div class="card"><h3>2. Put more riders on at 12 pm and 7 pm, and on rainy days</h3><p>Pay a rain bonus and use the weather forecast to schedule riders. Heavy rain makes late orders and cancellations jump.</p></div><div class="card"><h3>3. Build a rider reserve before the wet months</h3><p>July 2022 shows what happens with no riders: cancellations hit 27%. Recruit and book standby riders before May to July.</p></div></div>
<div class="card" style="margin-top:14px"><h3>Data problems found and fixed</h3><ul><li>60 duplicate order IDs removed (the dictionary says 45,341 rows, we use 45,281).</li><li>Dates came in two formats. Status had 8 spellings, payment method 11, and cuisine had spelling variants. All merged.</li><li>Delivery time had values of −58 and 999 minutes, and 23 orders had impossible food values (such as 1 or 810,900 LKR). These were treated as errors.</li><li>Weather rainfall had −999 placeholders, replaced with the median.</li><li>Dictionary mistakes: weather conditions are Dry, Light Rain and Heavy Rain (not Sunny, Rainy, Stormy); commission is stored as 0.18 (not 18); ratings go from 1 to 5 (not 1 to 10); there is no Refunded status.</li><li>Cancelled orders have no delivery time or rider pay by design, so they are left blank.</li></ul></div>`}
const PG=[['Overview',p0],['Free Delivery',p1],['Rain',p2],['Busy hours',p3],['Cancellations',p4],['Who earns',p5],['Actions',p6]];
document.getElementById('nav').innerHTML=PG.map((p,i)=>`<button onclick="go(${i})">${p[0]}</button>`).join('');
function go(i){cur=i;document.querySelectorAll('#nav button').forEach((b,j)=>b.classList.toggle('on',i==j));document.getElementById('bc').textContent=PG[i][0];const b=document.getElementById('bar');b.classList.remove('run');void b.offsetWidth;b.classList.add('run');V.classList.remove('in');void V.offsetWidth;PG[i][1]();V.classList.add('in');location.hash='p'+i}
go(Math.max(0,+(location.hash.slice(2))||0)>6?0:+(location.hash.slice(2))||0);
</script></body></html>
